name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    name: package and CPU checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest ruff build
          python -m pip install -e .

      - name: Build wheel
        run: python -m build

      - name: CPU tests
        run: CUDA_VISIBLE_DEVICES="" python -m pytest tests/ -q

      - name: Lint
        run: ruff check src bench scripts tests
