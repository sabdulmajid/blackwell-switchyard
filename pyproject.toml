[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwell-switchyard"
version = "0.0.1"
description = "High-performance Block Attention Residuals for NVIDIA Blackwell GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ayman Abdul-Majid" }]
keywords = ["cuda", "triton", "blackwell", "attention-residuals", "gpu", "kernel", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. torch and triton are treated as environment prerequisites
# rather than resolved dependencies: the correct build is hardware- and CUDA-specific,
# and pinning a wheel here would fight the user's existing install.
dependencies = []

[project.optional-dependencies]
# Everything needed to run the benchmark suite and regenerate every table and plot.
bench = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8", "tabulate>=0.9"]
test = ["pytest>=8.0", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/sabdulmajid/blackwell-switchyard"
Issues = "https://github.com/sabdulmajid/blackwell-switchyard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device",
  "slow: long-running test, excluded from the default run",
  "blackwell: requires compute capability 12.0 (sm_120)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
